[package]
name = "float-lang"
version = "0.2.0"
edition = "2021"
description = "CW Script（Float Script）原生语言核心：词法 → 语法 → 字节码 → 虚拟机"
license = "MIT"

# 独立工作区，避免 src-tauri 那个包的 workspace 探测干扰
[workspace]

[lib]
name = "float_lang"
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
