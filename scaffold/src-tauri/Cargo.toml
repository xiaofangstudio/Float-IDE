[package]
name = "floatide"
version = "0.12.0"
description = "Float Script 专用 IDE：代码世界（CW Script 系）语言的写作与调试"
authors = ["小方工作室"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[lib]
name = "floatide_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
portable-pty = "0.8"

[profile.release]
opt-level = 2
lto = false
