# Float IDE 三平台构建：Windows / macOS / Linux 一次全出。
# Tauri 必须在各平台原生构建（macOS 需 Xcode、Linux 需 WebKitGTK），
# Windows 本机交叉编译不出 .dmg / .deb / .AppImage，所以三包由 CI 的原生 runner 产出。
# 用法：push 一个 v* 标签，或在 Actions 里手动 Run workflow。
name: Build Float IDE (3 platforms)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Float-IDE-Windows
            bundles: nsis
          - os: macos-latest
            artifact: Float-IDE-macOS
            bundles: dmg
          - os: ubuntu-22.04
            artifact: Float-IDE-Linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scaffold/package-lock.json

      - name: Linux 系统依赖（WebKitGTK / AppIndicator）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "scaffold/src-tauri -> target"

      - name: 安装依赖
        working-directory: scaffold
        run: npm ci

      - name: 类型检查
        working-directory: scaffold
        run: npm run typecheck

      - name: 构建安装包
        working-directory: scaffold
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # AppImage 需要方形图标与 linuxdeploy，单独一步跑；失败也不挡 deb 上传。
      - name: 追加构建 AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: scaffold
        run: npm run tauri build -- --bundles appimage

      - name: 收集产物
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          # 只收安装包本体：bundle 里还有被打包的 Copper 环境 exe，不能一起挂上去
          find scaffold/src-tauri/target/release/bundle -type f \
            \( -name '*setup.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
